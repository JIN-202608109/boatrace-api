<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌸 ボートレースAI予想ノート 🌸</title>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4a90e2;
            --accent: #ff6b81;
            --bg-color: #f0f8ff;
            --card-bg: #ffffff;
            --text-main: #4a4a4a;
        }

        body {
            font-family: 'M PLUS Rounded 1c', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e1f0ff 2px, transparent 2px);
            background-size: 20px 20px;
            color: var(--text-main);
            margin: 0;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 80vh;
        }

        .hero-card {
            background-color: var(--card-bg);
            border-radius: 24px;
            padding: 40px 25px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            border: 2px solid #e3f2fd;
            box-sizing: border-box;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        h1 {
            color: #1a5276;
            font-size: 1.6rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        p {
            color: #6c7a89;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-predict {
            display: inline-block;
            background: linear-gradient(135deg, #ff6b81 0%, #ff85a2 100%);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            padding: 16px 32px;
            border-radius: 50px;
            text-decoration: none;
            box-shadow: 0 6px 20px rgba(255, 107, 129, 0.4);
            transition: all 0.2s ease;
        }

        .btn-predict:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255, 107, 129, 0.5);
        }

        .footer {
            margin-top: 30px;
            color: #a0aec0;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="hero-card">
        <div class="logo">🚤✨</div>
        <h1>ボートレース AI予想ノート</h1>
        <p>
            データ分析に基づいた本日の厳選レースをお届けします🌸<br>
            初心者の方でも見やすいポップな予想カードでチェック！
        </p>
        <a href="predict.html" class="btn-predict">本日の予想を見る 🎯</a>
    </div>

    <div class="footer">
        © 2026 Boat Race Predictor 💖
    </div>

</body>
</html>
