<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ボートレースAI予想 | トップページ</title>
    <!-- Google Fonts から丸ゴシック調のポップなフォントを読み込み -->
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
    
    <style>
        /* 基本スタイルリセット */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'M PLUS Rounded 1c', sans-serif;
        }

        body {
            background-color: #FFF9E6; /* 温かみのあるクリームイエロー */
            color: #4A3E3D;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ヘッダー */
        header {
            background-color: #FFFFFF;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 12px rgba(255, 154, 60, 0.15);
            border-bottom: 3px solid #FFE066;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: #FF7E36;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* ヒーローセクション */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2.5rem 1.5rem;
            background: linear-gradient(180deg, #FFF9E6 0%, #FFF0C2 100%);
        }

        .hero-badge {
            background-color: #FFD166;
            color: #D84A00;
            font-size: 0.9rem;
            font-weight: 700;
            padding: 0.4rem 1.2rem;
            border-radius: 20px;
            margin-bottom: 1.2rem;
            display: inline-block;
        }

        .hero h1 {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 1rem;
            line-height: 1.4;
            color: #332C2B;
        }

        .hero h1 span {
            color: #FF6B35;
            background: linear-gradient(transparent 60%, #FFE66D 60%);
        }

        .hero p {
            font-size: 1rem;
            color: #665A58;
            max-width: 500px;
            margin-bottom: 2.5rem;
            line-height: 1.7;
            font-weight: 400;
        }

        /* ポップでぷっくりしたアクションボタン */
        .btn-prediction {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #FF9F1C 0%, #FF6B35 100%);
            color: #FFFFFF;
            font-size: 1.3rem;
            font-weight: 800;
            padding: 1.1rem 2.8rem;
            border-radius: 50px;
            text-decoration: none;
            /* ぷっくり立体感を出す影 */
            box-shadow: 0 6px 0 #D84A00, 0 10px 20px rgba(255, 107, 53, 0.3);
            transition: all 0.15s ease;
            position: relative;
            top: 0;
        }

        .btn-prediction:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #D84A00, 0 12px 22px rgba(255, 107, 53, 0.4);
            background: linear-gradient(135deg, #FFAA33 0%, #FF7744 100%);
        }

        .btn-prediction:active {
            top: 4px;
            box-shadow: 0 2px 0 #D84A00, 0 4px 10px rgba(255, 107, 53, 0.3);
        }

        /* 特徴カード */
        .features {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            margin-top: 3rem;
            flex-wrap: wrap;
            max-width: 700px;
            width: 100%;
        }

        .card {
            background-color: #FFFFFF;
            padding: 1.5rem;
            border-radius: 20px;
            flex: 1;
            min-width: 220px;
            box-shadow: 0 8px 20px rgba(255, 154, 60, 0.08);
            border: 2px solid #FFE8A3;
            text-align: center;
        }

        .card-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .card h3 {
            color: #FF6B35;
            margin-bottom: 0.4rem;
            font-size: 1.1rem;
            font-weight: 700;
        }

        .card p {
            font-size: 0.88rem;
            color: #7A6C6A;
            margin-bottom: 0;
            line-height: 1.5;
        }

        /* フッター */
        footer {
            background-color: #FFFFFF;
            text-align: center;
            padding: 1.2rem;
            font-size: 0.8rem;
            color: #9E8E8C;
            border-top: 2px solid #FFE8A3;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <span>🚤</span> BOAT RACE PREDICT
        </div>
    </header>

    <main class="hero">
        <div class="hero-badge">✨ AIがサクッと予想 ✨</div>
        <h1>データでお得に楽しむ♪<br><span>ボートレースAI予想</span></h1>
        <p>過去のデータから、今日のおすすめレースと買い目をわかりやすくお届けします！初心者さんにもぴったり♪</p>

        <!-- 「今日の予想」ボタン：race_prediction.html に遷移 -->
        <a href="race_prediction.html" class="btn-prediction">
            今日の予想を見る ➔
        </a>

        <div class="features">
            <div class="card">
                <div class="card-icon">📊</div>
                <h3>かんたんデータ分析</h3>
                <p>会場の特徴やモーター性能をAIがわかりやすく解説！</p>
            </div>
            <div class="card">
                <div class="card-icon">💡</div>
                <h3>スマートな買い目</h3>
                <p>展開予想から厳選した買い目をリアルタイムでお届け！</p>
            </div>
        </div>
    </main>

    <footer>
        &copy; Boat Race Prediction. All rights reserved.
    </footer>

</body>
</html>
